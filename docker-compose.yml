version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: mobileshop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-posuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPass@123}
      POSTGRES_DB: ${DB_NAME:-mobileshop_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-posuser} -d ${DB_NAME:-mobileshop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mobileshop_network

  # ─── Node.js API Server ────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mobileshop_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-posuser}:${DB_PASSWORD:-StrongPass@123}@db:5432/${DB_NAME:-mobileshop_db}?schema=public
      NODE_ENV: production
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mobileshop_network
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             node src/index.js"

  # ─── Nginx (Serves React App + Proxies API) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mobileshop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - api
    networks:
      - mobileshop_network

volumes:
  postgres_data:
  uploads_data:
  logs_data:

networks:
  mobileshop_network:
    driver: bridge
