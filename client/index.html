<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d16" />
  <meta name="description" content="PrimeCell POS — Mobile Shop POS & Inventory Management System" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Google Fonts: Inter (English) + Noto Sans Arabic (Urdu) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>PrimeCell POS — Mobile Shop & Inventory System</title>
  <style>
    /* Initial loading screen before React mounts */
    #root-loader {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #090d16; flex-direction: column; gap: 16px;
    }
    #root-loader .spinner {
      width: 52px; height: 52px; border: 4px solid rgba(16,185,129,0.2);
      border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    #root-loader p { color: #94a3b8; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="root-loader">
      <div class="spinner"></div>
      <p>Loading PrimeCell POS...</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
